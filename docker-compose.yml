services:
  postgres:
    image: postgres:16-alpine
    container_name: ugpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ugpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugpilot}
      POSTGRES_DB: ${POSTGRES_DB:-ugpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ugpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metasearch for bots/API. Multi-arch (Oracle ARM aarch64 OK).
  # Bound to localhost only — do not open 8080 publicly.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ugpilot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://127.0.0.1:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ugpilot-dev-searxng-secret-change-me}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  searxng_data:
